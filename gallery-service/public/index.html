<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>作品の投稿 | 澤本</title><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head><body><main><header><a href="https://sawanoto.github.io/sawamoto/">澤本公式サイト</a><a href="/cdn-cgi/access/logout">ログアウト</a></header><h1>作品を残す</h1><p>写真だけでも大丈夫。公開する写真を確認して投稿します。</p><p id="status" role="status" aria-live="polite">本人認証と作品一覧を確認中…</p><form id="editor"><fieldset id="controls" disabled><label>作品の種類<select name="kind"><option value="children">子どもの作品</option><option value="handwork">大人の作品</option><option value="life">生活</option></select></label><div class="choices"><label class="pick">写真を選ぶ<input id="photos" type="file" accept="image/*" multiple></label><label class="pick">カメラで撮影<input id="camera" type="file" accept="image/*" capture="environment"></label></div><p>1作品12枚まで。顔・氏名・住所などが写っていないか確認してください。写真は一般公開されます。</p><div id="preview"></div><details><summary>作品名・日付・説明など（任意）</summary><label>作品名<input name="title" maxlength="500"></label><label><span id="date-label">制作日</span><input name="date" type="date" required></label><p>初期値は今日です。過去の写真は日付を変更してください。</p><label data-kind="children">制作場所<input name="place" maxlength="500"></label><label data-kind="handwork">使用素材<input name="materials" maxlength="500"></label><label>コメント・説明<textarea name="description" maxlength="2000" rows="3"></textarea></label><label>関連記事URL<input name="article_url" type="url" inputmode="url" placeholder="https://" maxlength="500"></label><label>販売ページURL<input name="sale_url" type="url" inputmode="url" placeholder="https://" maxlength="500"></label></details><button id="submit" type="submit">投稿する</button><button type="button" id="new-work">新しい作品</button><button type="button" id="delete" hidden>この作品を削除</button></fieldset></form><h2>これまでの作品</h2><button type="button" id="reload">一覧を読み直す</button><p>公開サイトへの反映には数分かかります。編集は作品名をタップしてください。</p><div id="items"></div></main></body></html>
