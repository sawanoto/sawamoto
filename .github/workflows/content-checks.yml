name: Check content build
on:
  pull_request:
    paths:
      - build.py
      - kigo.py
      - game_history.py
      - content/**
      - tests/test_*.py
      - requirements.txt
      - .github/workflows/content-checks.yml
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python build.py
