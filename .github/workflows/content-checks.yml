name: Check content build
on:
  pull_request:
    paths:
      - build.py
      - kigo.py
      - life_timeline.py
      - game_history.py
      - content/**
      - tests/test_*.py
      - requirements.txt
      - scripts/preview-sawanoalan.py
      - docs/sawanoalan/**
      - .github/workflows/content-checks.yml
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python build.py
      - name: Build imported article review
        run: python scripts/preview-sawanoalan.py
      - uses: actions/upload-artifact@v4
        with:
          name: sawanoalan-article-review
          path: .private/sawanoalan-preview/review.html
          include-hidden-files: true
