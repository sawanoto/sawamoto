name: Check seasonal themes
on:
  pull_request:
    paths:
      - assets/**
      - build.py
      - content/**
      - tests/seasonal*.cjs
      - .github/workflows/seasonal-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seasonal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: python build.py
      - run: node --test --test-isolation=none tests/seasonal.test.cjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/seasonal.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seasonal-theme-screenshots
          path: .private/seasonal-screenshots/
          if-no-files-found: ignore
          retention-days: 14
