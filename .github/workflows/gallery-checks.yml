name: Check photo galleries
on:
  pull_request:
    paths:
      - gallery.py
      - gallery-service/**
      - assets/gallery.*
      - build.py
      - content/galleries/**
      - tests/gallery.browser.cjs
      - tests/test_gallery.py
      - .github/workflows/gallery-*.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python scripts/check_writing.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python build.py
      - run: npm ci
        working-directory: gallery-service
      - run: npm test
        working-directory: gallery-service
      - run: npx wrangler deploy --dry-run
        working-directory: gallery-service
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/gallery.browser.cjs
